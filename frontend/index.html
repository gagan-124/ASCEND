<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCEND — AI Career & Interview Intelligence</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=stardom@400&f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet" />
    <script src="https://js.puter.com/v2/"></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ascend_theme_mode');
          var isDark = saved ? saved === 'dark' : (!window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-ascend-sand selection:text-ascend-navy">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
